<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ad Explorer</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <div class="app-container">
        <header style="display: flex; justify-content: space-between; align-items: center; padding: 8px 16px;">
            <div class="stats">
                <span id="count-total">0</span> Found
            </div>
            <button id="clear-btn" class="header-icon" title="Clear List">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2">
                    </path>
                </svg>
            </button>
            <div class="export-wrap" style="display: flex; gap: 2px;">
                <button id="export-csv-btn" class="header-icon" title="Export CSV">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="7 10 12 15 17 10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                </button>
                <button id="export-excel-btn" class="header-icon" title="Export Excel (.xlsx)">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="3" y1="9" x2="21" y2="9"></line>
                        <line x1="9" y1="21" x2="9" y2="9"></line>
                    </svg>
                </button>
                <button id="export-full-btn" class="header-icon" title="Export ZIP: CSV + Excel + Images">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 8V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v2"></path>
                        <path d="M21 8v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8"></path>
                        <polyline points="7 10 12 15 17 10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                </button>
                <button id="export-api-btn" class="header-icon" title="Export captured API calls (JSON)">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="16 18 22 12 16 6"></polyline>
                        <polyline points="8 6 2 12 8 18"></polyline>
                        <line x1="13" y1="4" x2="11" y2="20"></line>
                    </svg>
                </button>
            </div>
            <button id="settings-btn" class="header-icon" title="Settings">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path
                        d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.1a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z">
                    </path>
                    <circle cx="12" cy="12" r="3"></circle>
                </svg>
            </button>
        </header>

        <div id="export-progress"
            style="margin: 0 16px 4px 16px; height: 3px; background: #222; border-radius: 999px; overflow: hidden; display: none;">
            <div id="export-progress-bar" style="height: 100%; width: 0%; background: #00b894;"></div>
        </div>

        <div class="controls">
            <div class="search-box">
                <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#888"
                    stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="search-input" placeholder="Search...">
            </div>

            <div class="filter-row" style="display: flex; gap: 12px; margin-bottom: 12px; padding: 0 4px;">
                <label>
                    <input type="checkbox" id="filter-google" checked>
                    <span class="custom-checkbox"></span>
                    Google Play
                </label>
                <label>
                    <input type="checkbox" id="filter-apple" checked>
                    <span class="custom-checkbox"></span>
                    App Store
                </label>
            </div>
        </div>

        <div id="ads-list" class="ads-list">
            <div class="empty-state">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="1">
                    <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
                    <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
                </svg>
                <p>No ads detected yet</p>
                <p class="sub-text">Browse the transparency center to find ads</p>
            </div>
        </div>

        <div id="settings-panel" class="settings-panel hidden">
            <div class="settings-header">
                <h3>Settings</h3>
                <button id="close-settings" class="icon-btn">&times;</button>
            </div>

            <div class="setting-group">
                <label class="setting-label"
                    style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
                    <span>
                        Collection enabled<br>
                        <span style="font-size: 11px; color: #888; font-weight: normal;">Save detected ads to the list. Turn off to browse without collecting.</span>
                    </span>
                    <label class="toggle-switch"
                        style="position: relative; display: inline-block; width: 34px; height: 20px;">
                        <input type="checkbox" id="collection-enabled-toggle" checked
                            style="opacity: 0; width: 0; height: 0;">
                        <span class="slider round"
                            style="position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #444; transition: .4s; border-radius: 34px;"></span>
                    </label>
                </label>
            </div>

            <div class="setting-group" style="margin-top: 10px;">
                <label class="setting-label"
                    style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
                    <span>
                        Economy Mode<br>
                        <span style="font-size: 11px; color: #888; font-weight: normal;">Removes ads from page after
                            scanning to prevent lag. Disables badges.</span>
                    </span>
                    <label class="toggle-switch"
                        style="position: relative; display: inline-block; width: 34px; height: 20px;">
                        <input type="checkbox" id="economy-mode-toggle" checked
                            style="opacity: 0; width: 0; height: 0;">
                        <span class="slider round"
                            style="position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #444; transition: .4s; border-radius: 34px;"></span>
                        <style>
                            .toggle-switch input:checked+.slider {
                                background-color: #007aff;
                            }

                            .slider:before {
                                position: absolute;
                                content: "";
                                height: 14px;
                                width: 14px;
                                left: 3px;
                                bottom: 3px;
                                background-color: white;
                                transition: .4s;
                                border-radius: 50%;
                            }

                            .toggle-switch input:checked+.slider:before {
                                transform: translateX(14px);
                            }
                        </style>
                    </label>
                </label>
            </div>

            <div class="setting-group" id="economy-scroll-group" style="margin-top: 4px; padding-left: 12px;">
                <label class="setting-label"
                    style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
                    <span>
                        Only on Scroll<br>
                        <span style="font-size: 11px; color: #888; font-weight: normal;">Activate economy mode only when
                            auto-scroll is running</span>
                    </span>
                    <label class="toggle-switch"
                        style="position: relative; display: inline-block; width: 34px; height: 20px;">
                        <input type="checkbox" id="economy-scroll-toggle" style="opacity: 0; width: 0; height: 0;">
                        <span class="slider round"
                            style="position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #444; transition: .4s; border-radius: 34px;"></span>
                    </label>
                </label>
            </div>

            <div class="setting-group" style="margin-top: 10px; border-top: 1px solid #333; padding-top: 12px;">
                <label class="setting-label">Scroll Mode</label>
                <div class="radio-group">
                    <label class="radio-option">
                        <input type="radio" name="scroll_mode" value="fast" checked>
                        <span class="radio-custom"></span>
                        <div class="radio-text">
                            <span class="mode-title">Fast (Turbo)</span>
                            <span class="mode-desc">Jumps to bottom, waits for load</span>
                        </div>
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="scroll_mode" value="smooth">
                        <span class="radio-custom"></span>
                        <div class="radio-text">
                            <span class="mode-title">Smooth</span>
                            <span class="mode-desc">Continuous smooth scrolling</span>
                        </div>
                    </label>
                </div>
            </div>

            <div class="setting-group" id="speed-group" style="display: none;">
                <label class="setting-label">
                    Smooth Speed
                    <span id="speed-val">50</span>
                </label>
                <input type="range" id="smooth-speed" min="10" max="200" step="10" value="50">
            </div>
        </div>

        <footer>
            <button id="btn-scroll" class="action-btn start">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 5v14M19 12l-7 7-7-7"></path>
                </svg>
                Start Smart Scroll
            </button>
            <button id="btn-stop-scroll" class="action-btn stop hidden">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="6" y="6" width="12" height="12"></rect>
                </svg>
                Stop Scroll
            </button>
        </footer>
    </div>
    <script src="../lib/jszip.min.js"></script>
    <script src="../lib/xlsx.mini.min.js"></script>
    <script src="../shared.js"></script>
    <script src="popup.js"></script>
</body>

</html>
