services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ads_monitor
      POSTGRES_USER: ads
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ads -d ads_monitor"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: sh -c "npm run validate:env:web && npm run prisma:generate && npm run prisma:migrate:deploy && npm --workspace apps/web run start"
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      GOOGLE_PROXY_URL: ${GOOGLE_PROXY_URL:-}
      GOOGLE_PROXY_ENABLED: ${GOOGLE_PROXY_ENABLED:-false}
      GOOGLE_CLIENT: ${GOOGLE_CLIENT:-browser-native}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Ads Transparency Monitor}
    ports:
      - "${WEB_PORT:-3100}:3000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: .
    shm_size: "1gb"
    command: sh -c "npm run validate:env:worker && npm run prisma:generate && npm run prisma:migrate:deploy && npm --workspace apps/worker run start"
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      GOOGLE_PROXY_URL: ${GOOGLE_PROXY_URL:-}
      GOOGLE_PROXY_ENABLED: ${GOOGLE_PROXY_ENABLED:-false}
      GOOGLE_CLIENT: ${GOOGLE_CLIENT:-browser-native}
      GOOGLE_BROWSER_HEADLESS: ${GOOGLE_BROWSER_HEADLESS:-true}
      GOOGLE_BROWSER_CHANNEL: ${GOOGLE_BROWSER_CHANNEL:-chromium}
      GOOGLE_BROWSER_ECONOMY: ${GOOGLE_BROWSER_ECONOMY:-delete}
      GOOGLE_BROWSER_SCROLL_MODE: ${GOOGLE_BROWSER_SCROLL_MODE:-smooth}
      GOOGLE_BROWSER_SCROLL_DRIVER: ${GOOGLE_BROWSER_SCROLL_DRIVER:-js}
      GOOGLE_BROWSER_PREVIEW_MAX_CHECKS: ${GOOGLE_BROWSER_PREVIEW_MAX_CHECKS:-80}
      GOOGLE_BROWSER_PREVIEW_STALE_CHECKS: ${GOOGLE_BROWSER_PREVIEW_STALE_CHECKS:-12}
      GOOGLE_BROWSER_SEARCH_TIMEOUT_MS: ${GOOGLE_BROWSER_SEARCH_TIMEOUT_MS:-180000}
      GOOGLE_BROWSER_PAGE_PROCESS_TIMEOUT_MS: ${GOOGLE_BROWSER_PAGE_PROCESS_TIMEOUT_MS:-180000}
      GOOGLE_BROWSER_ADVANCE_TIMEOUT_MS: ${GOOGLE_BROWSER_ADVANCE_TIMEOUT_MS:-8000}
      GOOGLE_BROWSER_MAX_EMPTY_ADVANCES_PER_PAGE: ${GOOGLE_BROWSER_MAX_EMPTY_ADVANCES_PER_PAGE:-10}
      GOOGLE_BROWSER_FRAME_CAPTURE_TIMEOUT_MS: ${GOOGLE_BROWSER_FRAME_CAPTURE_TIMEOUT_MS:-2500}
      GOOGLE_BROWSER_FRAME_SCAN_LIMIT: ${GOOGLE_BROWSER_FRAME_SCAN_LIMIT:-24}
      GOOGLE_BROWSER_VISIBLE_CAPTURE_TIMEOUT_MS: ${GOOGLE_BROWSER_VISIBLE_CAPTURE_TIMEOUT_MS:-2500}
      GOOGLE_BROWSER_PRUNE_TIMEOUT_MS: ${GOOGLE_BROWSER_PRUNE_TIMEOUT_MS:-2500}
      GOOGLE_BROWSER_ECONOMY_CLEAR_BATCH: ${GOOGLE_BROWSER_ECONOMY_CLEAR_BATCH:-40}
      GOOGLE_BROWSER_SCROLL_SWEEP: ${GOOGLE_BROWSER_SCROLL_SWEEP:-false}
      GOOGLE_BROWSER_SCROLL_STEP_PX: ${GOOGLE_BROWSER_SCROLL_STEP_PX:-520}
      GOOGLE_BROWSER_SCROLL_PAUSE_MS: ${GOOGLE_BROWSER_SCROLL_PAUSE_MS:-25}
      GOOGLE_BROWSER_SCROLL_STEPS: ${GOOGLE_BROWSER_SCROLL_STEPS:-8}
      GOOGLE_BROWSER_INITIAL_WAIT_MS: ${GOOGLE_BROWSER_INITIAL_WAIT_MS:-250}
      GOOGLE_BROWSER_INITIAL_SCROLL_STEPS: ${GOOGLE_BROWSER_INITIAL_SCROLL_STEPS:-1}
      GOOGLE_BROWSER_INITIAL_SCROLL_STEP_PX: ${GOOGLE_BROWSER_INITIAL_SCROLL_STEP_PX:-420}
      GOOGLE_BROWSER_INITIAL_SCROLL_PAUSE_MS: ${GOOGLE_BROWSER_INITIAL_SCROLL_PAUSE_MS:-20}
      GOOGLE_BROWSER_PRUNE_SCROLL_STEP_PX: ${GOOGLE_BROWSER_PRUNE_SCROLL_STEP_PX:-560}
      GOOGLE_BROWSER_READY_BATCH_SIZE: ${GOOGLE_BROWSER_READY_BATCH_SIZE:-40}
      GOOGLE_BROWSER_READY_SETTLE_MS: ${GOOGLE_BROWSER_READY_SETTLE_MS:-80}
      GOOGLE_BROWSER_DETAIL_DELAY_MS: ${GOOGLE_BROWSER_DETAIL_DELAY_MS:-12000}
      GOOGLE_BROWSER_DETAIL_BATCH_PER_PAGE: ${GOOGLE_BROWSER_DETAIL_BATCH_PER_PAGE:-3}
      GOOGLE_BACKGROUND_DETAIL_ENABLED: ${GOOGLE_BACKGROUND_DETAIL_ENABLED:-true}
      GOOGLE_BACKGROUND_DETAIL_CONCURRENCY: ${GOOGLE_BACKGROUND_DETAIL_CONCURRENCY:-2}
      GOOGLE_BACKGROUND_DETAIL_BATCH_SIZE: ${GOOGLE_BACKGROUND_DETAIL_BATCH_SIZE:-10}
      GOOGLE_BACKGROUND_DETAIL_POLL_MS: ${GOOGLE_BACKGROUND_DETAIL_POLL_MS:-30000}
      GOOGLE_BACKGROUND_PREVIEW_BACKFILL_ENABLED: ${GOOGLE_BACKGROUND_PREVIEW_BACKFILL_ENABLED:-false}
      GOOGLE_BACKGROUND_MIN_FREE_MEMORY_MB: ${GOOGLE_BACKGROUND_MIN_FREE_MEMORY_MB:-1700}
      SCAN_EVENT_STDOUT: ${SCAN_EVENT_STDOUT:-true}
      PROXY_TIMEOUT_COOLDOWN_MS: ${PROXY_TIMEOUT_COOLDOWN_MS:-120000}
      PROXY_BLOCKED_COOLDOWN_MS: ${PROXY_BLOCKED_COOLDOWN_MS:-3600000}
      GOOGLE_DETAIL_CONCURRENCY: ${GOOGLE_DETAIL_CONCURRENCY:-1}
      GOOGLE_BROWSER_PROFILE_DIR: ${GOOGLE_BROWSER_PROFILE_DIR:-.google-browser-profiles}
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-15000}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
      WORKER_PEER_PID_CHECK: ${WORKER_PEER_PID_CHECK:-false}
    volumes:
      - worker-browser-profiles:/app/.google-browser-profiles
    depends_on:
      postgres:
        condition: service_healthy

  mcp:
    build: .
    command: sh -c "npm run validate:env:mcp && npm run prisma:generate && npm run prisma:migrate:deploy && npm --workspace apps/mcp run start"
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      MCP_HOST: ${MCP_HOST:-0.0.0.0}
      MCP_PORT: ${MCP_PORT:-3101}
      MCP_BEARER_TOKEN: ${MCP_BEARER_TOKEN:-}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-127.0.0.1,localhost,127.0.0.1}
      MCP_LOG_LEVEL: ${MCP_LOG_LEVEL:-info}
    ports:
      - "${MCP_PORT:-3101}:3101"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  worker-browser-profiles:
